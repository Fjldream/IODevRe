[ALLDEVICE]
	//帧前延时单位ms
	DelayBeforeFrame = 0
	
	//帧后延时单位ms
	DelayAfterFrame = 0
	
	//字符串类型Tag的字符串形式，为0时不相隔两个字节采集，非0时隔两个字节进行采集  (默认为0)
	CollectionType = 1
	
	//Pdu长度，当需要一个Tag一个包时，将该值置为 0 即可，当屏蔽时会使用设备回复的第二条初始化帧中的Pud长度，并且当该值设置的值超过初始化帧的PduSize时，该值会默认使用初始化帧中的PduSize
	//注意配置此处参数不是修改了初始化帧中的PduSize，而只是以该值为限制去判断接收的数据帧的最大的Pdu长度
	//MaxPduLen = 240
	
	//划分item的区间长度，即在同一个区间内的点会划分到一个item中。注意该值会在驱动中计算，该值会自动小于第二条初始化帧中PDU长度（注意此处不是与配置文件配置的MaxPudLen进行比较）。
	//MaxItemLen = 32
	
	//RemoteTSAP，该功能也保留使用


