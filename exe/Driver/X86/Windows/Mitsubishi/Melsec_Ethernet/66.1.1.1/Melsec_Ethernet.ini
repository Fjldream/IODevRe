//配置本地网卡的IP,单网卡的可以不用操作
[Local]
IP=0.0.0.0
PackLen = 200

//文件名扩展为1～8字符
[FileReg]
Mode=1
//Mode模式范围1-2
SubMode=1
//只要当Mode=2时，子模式才有用，SubMode子模式范围1-2（两种写入方式），默认为1，不要随意改动
DriverNo=0
//DriverNo驱动器号范围0-4。0表示内置RAM，1表示存储卡A的RAM，2表示存储卡A的ROM，3表示存储卡B的RAM，4表示存储卡B的ROM。

KeyWord=123456
//QCPU填写KeyWord的4位关键字默认1234
//QnACPU填写KeyWord的6位关键字默认123456

FileFlag=1
//QnACPU用户指定的驱动器上的关键字是否指定为上述

FileSize=4096
//FileSize默认4096

Digit=16
//X Y 寄存器 进制  默认16进制。可配置为：8进制、16进制 

Digit_ZR=16
//ZR寄存器 进制  默认16进制。可配置为：10进制、16进制 

PC_PortFlag = 0
// 默认为 0 ；PC_PortFlag=0 本地端口 重连不自增 ； PC_PortFlag=1 本地端口 重连自增

DEV_SleepFlag = 0
//  默认为0 ， 初始化设备不成功，将此Flag 置1 可等待设备回复ack确认信息

IP_192.168.1.11_SPARE_PLC_PORT_COUNT= 0
// PLC重连时备的用端口数，不配置时默认为0 。配置IP且值大于0时，在PLC重连时，先使用设备地址中定义的端口连接，连接失败后，依次使用下面配置文件中定义端口进行重连
IP_192.168.1.11_Port1 =  402
IP_192.168.1.11_Port2 =  403
IP_192.168.1.11_Port3 =  404
// 备用端口的端口号，其中IP_XX.X.XX.XX_PortX中替换为设备地址中的IP，
//备用端口数量要与IP_XX.XX.XX.XX_SPARE_PLC_PORT_COUNT值对应，（端口号使用16进制）

IP_172.30.20.82_SPARE_PLC_PORT_COUNT= 4
IP_172.30.20.82_Port1 =  409		//请将第个端口号配置为设备地址中的定义上午端口
IP_172.30.20.82_Port2 =  40A
IP_172.30.20.82_Port3 =  40B
IP_172.30.20.82_Port4 =  40C

[172.30.20.59]            //设备IP地址
DelayBeforeFrame = 10	   //帧前延时单位ms
DelayAfterFrame = 10	   //帧后延时单位ms